# Prebuilt harness releases — one GitHub Release per published build.
#
# Every push to `stable` (and every manual dispatch) publishes exactly one
# release. The release version appends the workflow run number to the tree's
# own package version: `v<package version>.<run number>`, e.g.
# `v0.1.7-enpoi.2.42`. The run number is monotonic per repository and needs no
# stored counter, so it names each build; no asset name carries a commit SHA.
# The build job exports this full release version as DSH_CLIENT_VERSION before
# `build:official`, so the shipped client artifacts (the Web UI's Settings →
# General "Current version" row and the other build-metadata surfaces) name the
# release they came from, while package.json keeps the tree base for the
# installer's identity checks.
#
# A release holds exactly these assets, and nothing ever accumulates on an
# older release:
#   dsh-harness-<version>-linux-x64.tar.gz        + .sha256
#   dsh-harness-<version>-darwin-arm64.tar.gz     + .sha256
#   dsh-harness-<version>-darwin-x64.tar.gz       + .sha256
#   SHA256SUMS
#
# The retired delta updater published per-platform manifests and consecutive
# diffs here; the default updater (full prebuilt tarball) needs none of them.
# The archived DSH_DELTA opt-in path is frozen: new releases intentionally
# carry no manifest/diff assets, so that path degrades to the full tarball.
#
# `prepare` resolves the version and skips a commit that already has a
# published release (a re-dispatch must not duplicate it). Builds upload into a
# DRAFT release so installers never observe a partially populated build;
# `publish` adds SHA256SUMS and flips the draft to published. Only `stable`
# triggers the workflow because both channel branches are pushed with the same
# commit: the stable run is the single build for that commit, and the installer
# resolves `beta` to the same newest release (scripts/install.sh
# latest_release_tag). `workflow_dispatch` remains the escape hatch for an
# explicit build.
#
# Runner labels: `macos-13` (x86_64) was retired on 2025-12-08. The closest
# documented GitHub-hosted x86_64 image is `macos-15-intel` (the last Intel
# image, available until ~August 2027); `macos-14` is arm64.
#
# The artifact keeps the full built node_modules closure: `pnpm install --prod`
# and `pnpm prune --prod` were both measured and are unusable for this
# workspace (runtime-relevant peer packages are pinned in devDependencies in
# pnpm-lock.yaml, so a prod-only tree fails the smoke boot). Packing therefore
# stages the workspace, runs scripts/prune-release-tree.sh (VCS/build leftovers,
# source maps, committed specs/tests, Agent Notes, node_modules docs), then
# smoke-boots that pruned tree and tars exactly it.

name: Harness Release

on:
  workflow_dispatch:
  push:
    branches:
      - stable

permissions:
  contents: write

concurrency:
  group: harness-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      base: ${{ steps.version.outputs.base }}
      skip: ${{ steps.dedupe.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      - name: Resolve the release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(node -e "process.stdout.write(JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version)")"
          VERSION="$BASE.$GITHUB_RUN_NUMBER"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip a commit that already has a published release
        id: dedupe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SKIP=false
          # A published release carrying SHA256SUMS is complete under this
          # scheme (every platform's tarball sidecars are uploaded before
          # `publish` assembles them). Any draft never suppresses a build.
          EXISTING="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.draft == false) | select(.target_commitish == \"$GITHUB_SHA\") | select(any(.assets[]; .name == \"SHA256SUMS\")) | .tag_name" 2>/dev/null || true)"
          if [ -n "$EXISTING" ]; then
            echo "commit $GITHUB_SHA already has a published release ($EXISTING); skipping"
            SKIP=true
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Create the draft release (idempotent across re-runs)
        if: steps.dedupe.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          BASE_VERSION: ${{ steps.version.outputs.base }}
        run: |
          set -euo pipefail
          TAG="v$RELEASE_VERSION"
          # GITHUB_RUN_NUMBER is stable across re-runs, so a re-run finds the
          # draft from its first attempt: reuse it instead of failing at
          # `gh release create` with HTTP 422.
          if gh release view "$TAG" >/dev/null 2>&1; then
            STATE="$(gh release view "$TAG" --json isDraft,isPrerelease -q '[.isDraft, .isPrerelease] | @tsv')"
            case "$STATE" in
              *true*)
                echo "release $TAG already exists (draft); reusing it for this attempt"
                ;;
              *)
                echo "release $TAG already exists and is published; nothing to create"
                exit 0
                ;;
            esac
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" \
              --notes "Prebuilt Enpoi Harness $RELEASE_VERSION (tree version $BASE_VERSION, commit $GITHUB_SHA)."
          fi

  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: x64
          - runner: macos-14
            os: darwin
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: x64
    env:
      GH_TOKEN: ${{ github.token }}
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      # The desktop shell's Electron binary is never used by the CLI/web
      # runtime; skipping its download keeps CI fast and the artifact smaller.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      - name: Enable corepack (pnpm from the packageManager pin)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `build:official` resolves the official client environment through
      # scripts/build.ts: DSH_CLIENT_VERSION is the full release version
      # (tree base + run number) so the shipped client artifacts label the
      # release they came from, and the commit is the canonical 7-character
      # prefix (same shape the installer records).
      - name: Resolve official build environment
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          echo "DSH_CLIENT_COMMIT_HASH=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          echo "DSH_CLIENT_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Build official harness (includes build:web)
        run: pnpm run build:official

      # Every workspace package a shipped composition mounts by name must be in
      # the CLI's dependency closure: a miss imports fine in a checkout (pnpm
      # links everything) and fails on prebuilt installs — the 2.78
      # feedback-submit/-triage failure. This gate reproduces the runtime
      # resolution against the built tree.
      - name: Verify mounted packages resolve in the installation closure
        run: node scripts/verify-mounted-packages.mjs

      - name: Ensure profile plugin bundles
        env:
          HARNESS_ROOT: ${{ github.workspace }}
        run: bash profile/web/build-plugins.sh profile/web

      # The packaging gate: refuses operator state in the fresh-install
      # template and any committed per-device patch under device-patches/, so
      # another machine's settings can never reach the release archive.
      - name: Verify profile template carries no operator state
        run: node profile/web/scripts/verify-profile-template.mjs

      # The stage exists before the smoke so the gate boots the exact tree the
      # tarball will carry: a prune that drops a runtime file fails here.
      - name: Stage and prune the artifact tree
        id: stage
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="$RELEASE_VERSION"
          TOP="dsh-harness-$VERSION"
          STAGE="$RUNNER_TEMP/dsh-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          # Hardlinks keep the stage near-zero extra disk on the runner; fall
          # back to a full copy when the filesystem cannot link ($RUNNER_TEMP
          # and the workspace share one volume on GitHub-hosted runners).
          if ! cp -al "$GITHUB_WORKSPACE" "$STAGE/$TOP"; then
            rm -rf "$STAGE/$TOP"
            cp -a "$GITHUB_WORKSPACE" "$STAGE/$TOP"
          fi

          bash "$GITHUB_WORKSPACE/scripts/prune-release-tree.sh" "$STAGE/$TOP"

          # A no-op or partial prune must fail the release, not ship the weight.
          test ! -e "$STAGE/$TOP/.agents/notes"
          test -z "$(find "$STAGE/$TOP" -name '*.map' -print -quit)"
          echo "tree=$STAGE/$TOP" >> "$GITHUB_OUTPUT"

      - name: Smoke test (CLI + web surface, pruned tree)
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.stage.outputs.tree }}"
          test -f "$ROOT/apps/cli/lib/bin.js"
          test -f "$ROOT/apps/web/dist/index.html"
          test -f "$ROOT/.dsh-build/client-build-environment.json"

          SCRATCH="$RUNNER_TEMP/dsh-smoke"
          rm -rf "$SCRATCH"
          mkdir -p "$SCRATCH/home" "$SCRATCH/cwd"
          cd "$SCRATCH/cwd"

          export DSH_HOME="$SCRATCH/home"
          export DSH_AGENTS_HOME="$SCRATCH/home/.agents"
          export DSH_TELEMETRY_DISABLED=1
          export NODE_NO_WARNINGS=1

          echo "smoke: --version"
          node "$ROOT/apps/cli/lib/bin.js" --version

          echo "smoke: --profile web --dump-default-config"
          node "$ROOT/apps/cli/lib/bin.js" --profile web --dump-default-config > "$SCRATCH/default-config.yml"
          test -s "$SCRATCH/default-config.yml"

          echo "smoke: web surface boots and serves the app"
          # The fixture intercepts `open`, performs the token exchange and the
          # authenticated page fetch, then prints `dsh browser-open: {...,"status":200,...}`.
          # Its optional DSH_BROWSER_OPEN_TEST_EXIT_ON_READY hook exits on a
          # 250 ms timer that races that fetch, so the smoke polls for the
          # evidence line and terminates the (long-lived) server itself.
          export DEEPSEEK_API_KEY=keyless-smoke-no-call
          export SSH_CONNECTION= SSH_TTY=
          # The fixture is smoke instrumentation, not shipped product code, so
          # it runs from the workspace: the pruned stage carries no tests.
          node --import "$GITHUB_WORKSPACE/apps/cli/tests/fixtures/web-browser-open/register.mjs" \
            "$ROOT/apps/cli/lib/bin.js" web --port 0 > "$SCRATCH/web.log" 2>&1 &
          web_pid=$!
          deadline=$((SECONDS + 180))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if grep -q 'dsh browser-open: ' "$SCRATCH/web.log"; then break; fi
            sleep 1
          done
          if kill -0 "$web_pid" 2>/dev/null; then
            kill -TERM "$web_pid" 2>/dev/null || true
          fi
          wait "$web_pid" 2>/dev/null || true
          cat "$SCRATCH/web.log"
          grep -q 'dsh web: http://127.0.0.1:' "$SCRATCH/web.log"
          grep -q '"status":200' "$SCRATCH/web.log"

      - name: Pack artifact
        id: pack
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="$RELEASE_VERSION"
          TOP="dsh-harness-$VERSION"
          # SHA-free: the release tag names the build, so the asset carries the
          # release version, OS, and architecture only.
          ASSET="dsh-harness-$VERSION-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          # The stage was pruned and smoke-booted above; pack exactly it.
          STAGE="$RUNNER_TEMP/dsh-stage"

          tar -czf "$ASSET" -C "$STAGE" "$TOP"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ASSET" > "$ASSET.sha256"
          else
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          fi
          ls -lh "$ASSET" "$ASSET.sha256"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Upload to the draft release
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          ASSET='${{ steps.pack.outputs.asset }}'
          TAG="v$RELEASE_VERSION"

          attempt=1
          until gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber; do
            [ "$attempt" -ge 3 ] && { echo "upload failed after $attempt attempts"; exit 1; }
            attempt=$((attempt + 1))
            sleep 10
          done

  publish:
    name: publish release
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Assemble SHA256SUMS and publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$RELEASE_VERSION"
          SUMS="$RUNNER_TEMP/sums"
          rm -rf "$SUMS"
          mkdir -p "$SUMS"

          # Each platform sidecar already carries `<hash>  <asset>`; download
          # them all and concatenate into one manifest, then publish. A failed
          # build cell never reaches this job, so the release is never visible
          # with a missing platform. Assert the exact platform count anyway:
          # a truncated upload set must fail here, not publish a partial sums
          # file.
          gh release download "$TAG" --pattern '*.sha256' --dir "$SUMS"
          SIDECARS="$(ls -1 "$SUMS"/*.sha256 2>/dev/null | wc -l | tr -d ' ')"
          if [ "$SIDECARS" != "3" ]; then
            echo "publish: expected exactly 3 platform .sha256 sidecars, found $SIDECARS" >&2
            ls -la "$SUMS" >&2
            exit 1
          fi
          ( cd "$SUMS" && cat ./*.sha256 | LC_ALL=C sort -k2 > SHA256SUMS )
          cat "$SUMS/SHA256SUMS"
          gh release upload "$TAG" "$SUMS/SHA256SUMS" --clobber
          gh release edit "$TAG" --draft=false

  # The update catalogs exist only for published releases. This job runs when
  # the release was published by this run AND when a re-run deduped to an
  # already-published release (`publish` skipped), so a run that died between
  # publishing and the catalog copy self-heals: the generator is idempotent, so
  # re-running for the same tag is a no-op apart from `generatedAt`. A tag that
  # is absent or still a draft stops the step before anything is written.
  #
  # Both channels are maintained from the one shared release stream (the two
  # channel branches are pushed with the same commit, so one build serves both
  # installs): the same releases land in `stable.json` and `beta.json` with the
  # per-file `channel` field, and both ride the release as
  # `update-catalog-<channel>.json` assets. The branch file is the
  # always-current client fetch target —
  #   https://raw.githubusercontent.com/<owner>/<repo>/catalog/<channel>.json
  #   (branch `catalog`, file `<channel>.json` at the branch root).
  # Pushing to `catalog` cannot re-trigger this workflow: the push trigger is
  # branch-scoped to `stable` (see `on.push.branches`), and the catalog commit
  # also carries `[skip ci]` as belt-and-braces. The branch push is fail-soft —
  # a published release must never fail because this copy hiccuped; the assets
  # already carry the record.
  catalog:
    name: publish update catalogs
    needs:
      - prepare
      - build
      - publish
    if: >-
      always()
      && needs.prepare.result == 'success'
      && needs.publish.result != 'failure'
      && needs.publish.result != 'cancelled'
    runs-on: ubuntu-24.04
    steps:
      # Full history + tags: the catalogs are generated from `git log` between
      # release tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      - name: Publish the update catalogs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$RELEASE_VERSION"

          # Published-only: a re-run of a still-draft (or absent) release must
          # not surface an entry. `isDraft` answers both cases through gh's
          # exit status.
          STATE="$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null || echo missing)"
          if [ "$STATE" = "missing" ]; then
            echo "update catalog: no release for $TAG; nothing to publish"
            exit 0
          fi
          if [ "$STATE" = "true" ]; then
            echo "update catalog: $TAG is still a draft; nothing to publish"
            exit 0
          fi

          WORK="$RUNNER_TEMP/update-catalogs"
          rm -rf "$WORK"
          mkdir -p "$WORK/existing"

          # Seed each channel from its branch file so the new release prepends
          # (and a re-run replaces its own entry). A missing branch or file is
          # the first-run case for that channel: start empty.
          FETCHED=0
          if git fetch --depth=1 origin catalog 2>/dev/null; then
            FETCHED=1
            for CHANNEL in stable beta; do
              git show "FETCH_HEAD:$CHANNEL.json" > "$WORK/existing/$CHANNEL.json" 2>/dev/null \
                || rm -f "$WORK/existing/$CHANNEL.json"
            done
          fi

          # One build serves both channels, so both catalogs get this release;
          # each file carries its own `channel` field.
          for CHANNEL in stable beta; do
            EXISTING="$WORK/existing/$CHANNEL.json"
            if [ -s "$EXISTING" ]; then
              node scripts/update-catalog.mjs --channel "$CHANNEL" --tag "$TAG" --in "$EXISTING" --out "$WORK/update-catalog-$CHANNEL.json"
            else
              node scripts/update-catalog.mjs --channel "$CHANNEL" --tag "$TAG" --out "$WORK/update-catalog-$CHANNEL.json"
            fi
          done

          gh release upload "$TAG" "$WORK/update-catalog-stable.json" "$WORK/update-catalog-beta.json" --clobber

          # The branch push is the only fail-soft part: the release is already
          # published and the assets already carry the records. One commit
          # carries both files.
          catalogs_push() {
            WT="$WORK/branch"
            # A previous run in the same checkout can leave a stale worktree
            # registration; prune it before adding.
            git worktree prune || true
            if [ "$FETCHED" = 1 ]; then
              git worktree add --detach "$WT" FETCH_HEAD || return 1
              git -C "$WT" checkout -q -B catalog || return 1
            else
              git worktree add --detach "$WT" HEAD || return 1
              git -C "$WT" checkout -q --orphan catalog || return 1
              git -C "$WT" rm -rf . >/dev/null 2>&1 || true
            fi
            cp "$WORK/update-catalog-stable.json" "$WT/stable.json" || return 1
            cp "$WORK/update-catalog-beta.json" "$WT/beta.json" || return 1
            git -C "$WT" add stable.json beta.json || return 1
            git -C "$WT" -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "chore(catalog): stable+beta $TAG [skip ci]" || return 1
            git -C "$WT" push -q origin "HEAD:refs/heads/catalog" || return 1
          }
          if catalogs_push; then
            echo "update catalogs: pushed stable.json + beta.json for $TAG"
          else
            echo "::warning::update catalogs: branch push failed for $TAG; the assets update-catalog-stable.json and update-catalog-beta.json still carry this release"
          fi
