merge:
  enpoi-orchestration.mcpServers:
    plane-mcp:
      serverName: plane
      transport: streamable-http
      url: http://127.0.0.1:8211/http/api-key/mcp
      apiKeyEnv: PLANE_MCP_TOKEN
      headers:
        x-workspace-slug: main_base
  enpoi-orchestration.capabilities:
    mcp:
      plane-mcp: false
    skills:
      tier1-workflow: false
      test-alpha: true
      tier3-workflow: false
      tier2-workflow: false
    tools:
      oracle_review: true
      roundtable: true
