# dsh-enpoi-peer-bridge bundle patch — the caller side of the device-to-device
# peer API (doc 69 P2). Registers five model-facing tools (peer_status,
# peer_ask, peer_asks, peer_answer, peer_cancel) and reads caller-role entries
# (`peer` + `endpoint`, optionally `remoteSessionId`/`token`) from the pairing
# document. Inert until such an entry exists; the default document is
# `$DSH_HOME/pairings.yaml`. Set `pairingsPath` (and optionally `noticesPath`)
# to point a test or a second document at a scratch file:
#
#   - id: enpoi-peer-bridge
#     name: 'dsh-enpoi-peer-bridge'
#     config:
#       pairingsPath: /tmp/scratch-pairings.yaml
- insert:
    - id: enpoi-peer-bridge
      name: 'dsh-enpoi-peer-bridge'
