                ## Communication
                - Answer directly, no preamble, no flattery.
                - Brief delegation notices ("Checking docs via librarian...").
                - Keep the operator in the loop and state what you changed.
              suffix: |-
                You are the Creator — the operator of this DeepSeek Harness (Enpoi Harness). On the user's behalf you diagnose, change, add, and remove anything in the harness: compositions and profiles, plugins, skills and MCPs, providers and models, key pools and chains, permissions, tools and groups, context and compaction, UI surfaces, installs and updates — on any OS. You are the harness mechanic: the machine is live and your changes are real. Stay inside the harness plane — user application code belongs to `orchestrator`, host hardware/OS operations to `sysadmin`; say so in one line and stop.

                ## Knowledge base
                `docs/creator/00-index.md` in the harness checkout (`$REPO` — the tree holding `apps/` and `packages/`) is the map and the rules. Before any harness task: read `00-index.md`, then read THE ONE deep file it points to for the task (`01-architecture` … `11-troubleshooting`, `12-glossary`). Never guess a path, flag, default, or behavior — if you did not read it, read it; cite what you read as `path:line`. If a doc and the code disagree, the code wins — fix the doc in the same change (`$REPO/docs/creator/`).

                ## Operating rules
                - Verify with the gates in `docs/creator/11-troubleshooting.md`. "Done" means the gate is green on the changed tree and you quote the command with its output; every behavior change updates the affected creator doc in the same change.
                - Never restart the web service from inside a turn — `systemctl --user restart dsh-web` (or a bare `ds restart`) kills the process hosting your turn: the tool result never returns, the turn aborts. Schedule `dsh restart --after-turn` (default: bounded whole-service idle wait, 10 min; `--cancel` withdraws it); the detached `dsh restart --now` is for callers that are not the session host (a shell), never for a session turn.
                - Keep everything you write server-agnostic: no IP, hostname, or personal path in code, docs, or config. Write `$REPO`, `$DSH_HOME`, `$PROFILE`; machine values live in the device overlay (`$DSH_HOME/heavy-server-overlay.json`) and the profile's settings.
                - Back up before a destructive edit (copy the file, or state the exact rollback). Prefer the layered config — rows in `$PROFILE/cordis.patch.yml`, the overlay, settings documents — over editing code; make the smallest change and rebuild only the owning artifact.
                - Record what you changed: `file:line`, the command, the gate result, and the rollback.
                - Context & delegation: before a multi-step change or any dispatch, pin the task state and invariants on the whiteboard (`whiteboard_write` / `whiteboard_pin`) — children read the board but never author it (lineage gate), and the context keeper checkpoints the session automatically, so do not duplicate a brief by hand. Offload bounded edits to a `fixer`, codebase mapping to an `explorer`, and any live-web question to ONE `librarian` with a research dial (standard default); the librarian archives with `custom_research-fetch` and verifies with `custom_research-verify` — never fetch, save, or extract web research in this session.
                - Permissions: reads are free; `bash` and other destructive tools raise an approval card. Ask the operator to raise this session to Full access only for real harness surgery; even then the hard rails and these rules stand — never use a grant to dodge a gate.

                ## Deeper sources
                - Porting playbook and numbered safeguards: `~/dsh-migration/50-future-re-porting-and-upgrade-playbook.md` (the gates cite them).
                - Open backlog: `~/dsh-migration/82-open-backlog.md`.
                - Evidence, one directory per workstream (raw logs, verdict JSONs): `~/dsh-migration/evidence/`.
                - Verification guide: `~/dsh-migration/84-verification-guide.md`.
                These workbook paths are this machine's; where they are absent, the code and the gates in doc 11 are the authority.

                ## Toolbox
                read/grep/glob, edit/write, bash (pwsh on Windows), jobs, skills (`editing-cordis-compositions` before changing a composition; `cordis-plugin-development` for plugin work), `plugin_manager`, `cordis_inspect_*`, `session_debug`, `diagnostics_report`, `tool_groups` (attach/detach on-demand tool families; `debug` is pre-attached for diagnostics), `ask_user_question` when a decision is blocked.

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # The machine's system profile: a reference to the stored document, or
          # the documented default before one ran. Mounted in both cache-paired
          # presets so the shared prompt prefix stays byte-identical.
          - id: first-run-context
            name: '@deepseek-ai/dsh-host-first-run/context'

          # ── shell ───────────────────────────────────────────────────────────────────

          # `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
          # publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
          # the criterion for host-plane ownership — injection resolves before any session
          # exists, so there is no agent to key by. Behind a preset realm those variables
          # never reached the model's shell at all. Both shell tools consume the host
          # registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
          # host-plane too.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ──────────────────────────────────────────────────────────────

          # Both register into the host `tools` registry and provide nothing, so
          # they need no realm. The `fs` service and its policy stay in the host.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ────────────────────────────────────────────────────────

          # Only the model-facing controls. The task REGISTRY stays on the host plane:
          # its producers sit outside any realm this file could put it in — `tool-bash`
          # above resolves it with `ctx.get`, and an entry-local realm here is invisible
          # to every sibling row, so `run_in_background` would answer "background jobs
          # unavailable" while these controls sat in the catalog. The registry is keyed by
          # owning agent anyway, so one host instance serves every session. What a preset
          # chooses is whether its agent can collect and stop background work at all.
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── skills ──────────────────────────────────────────────────────────────────

          # The skill REGISTRY lives in the host composition and is layered per scope:
          # these rows register into THIS preset's layer of it, so they need no realm.
          # `skill-filesystem` contributes local-root discovery for agents on this preset, and
          # `tool-skill` gives them the catalog and loader; the merged catalog also
          # carries whatever the deployment registered globally (repository plugins).
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/',
                  baseUrl))"

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── self-modification ───────────────────────────────────────────────────────
          # Harness-authoring rows (plugin_manager, cordis inspection) are mounted on
          # every main preset so the tool array stays byte-identical across an agent
          # switch; the creator seat is the only seat allowed to CALL them (the
          # enpoi-capabilities pre-execute guard denies the other main seats).
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
          - id: tool-cordis
            name: '@deepseek-ai/dsh-tool-cordis'

          # ── goals ───────────────────────────────────────────────────────────────────

          # Only the model-facing tool. The goal SERVICE, its session driver, and the
          # `/goal` command stay on the host plane: the Gateway serves the goal domain as
          # Remote endpoints whose receiver comes from a generated descriptor, so it
          # resolves `goals` on the host and an entry-local realm here would hide it. The
          # registry is keyed by session anyway, so one host instance serves every
          # session. What a preset chooses is whether its agent can call the goal tool.
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── plan mode ───────────────────────────────────────────────────────────────

          # Plan state is per-agent by nature, so an entry-local realm is not a
          # workaround here — it is the correct lifetime.
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          # ── Enpoi orchestration tools ────────────────────────────────────────────
          # Agent-plane mounts inside an isolate realm: per-session plugin instances,
          # so the oracle fiber state is session-local and the tools register in THIS
          # agent's scope (children spawned with a toolFilter deny them — I14).
          - id: enpoi-orchestration
            name: cordis:group
            group: true
            isolate:
              enpoiOracle: true
            config:
              - id: enpoi-oracle
                name: 'dsh-enpoi-oracle'

              # Agent-facing debug/transparency read surface (doc 69 §9.1): the
              # read-only `session_debug` tool (digest/snapshot/incidents). Mounted in
              # this agent-plane scope on purpose — as a host-plane bundle it would
              # register globally and be visible to every preset.
              - id: enpoi-debug
                name: 'dsh-enpoi-debug'
              - id: enpoi-tool-groups
                name: 'dsh-enpoi-tool-groups'
                config:
                  seat: creator

          # ── compaction ──────────────────────────────────────────────────────────────

          # `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
          # share this realm rather than sit outside it.
          #
          # `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
          # plane, and the rows here resolve that one instance. It takes no configuration,
          # keys every fold by Session, and owns the context-meter projection units the
          # browser reads for every session — behind a realm those units would come and go
          # with whichever presets happen to be mounted. What a preset chooses is whether
          # its agent compacts at all, which is `compaction-basic` below.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

              # Durable image offload (doc 66 image policy): an image-capable
              # route that refuses an over-budget request retries after the
              # oldest image occurrences are durably marked offloaded, so media
              # never hard-fails a task or a summarizer call.
              - id: image-offload
                name: '@deepseek-ai/dsh-compaction-image-offload'

          # ── delegation and workflows ────────────────────────────────────────────────

          # The `subagents` registry and its spawn/fork backends live in the HOST
          # composition: the registry is a process singleton whose cross-session queries
          # the api-proxy serves to the browser, and a provider name may only be
          # registered once. This preset contributes the delegation TOOLS, which resolve
          # that host registry.
          #
          # `workflows` is different — nothing outside an agent reads it — so every row
          # that reaches it shares one entry-local realm here, and a consumer left
          # outside would resolve a host registry this preset does not populate.
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
                # Enpoi: enabled for RECOVERY. send_message continues a child that
                # stopped before its end result — the settlement notice names its
                # session id and stop reason. New work stays a fresh dispatch (see
                # tool-subagent).

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
                # Enpoi: enabled with send_message — lists this parent's continuable
                # children by id for the recovery flow.

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  # Enpoi: new work is always a fresh session. Background dispatches are
                  # continuable fibers whose settlement notice carries the child's final
                  # report and wakes/steers this session (no job ids, no job_output, no
                  # tool-jobs notices). Recovery is deliberate: a child that stopped
                  # before its end result names its session id and stop reason in the
                  # notice, and send_message below continues that session with its
                  # history. run_in_background: false waits in the tool result. Only the
                  # Oracle keeps a session across a query, inside its own plugin.
                  backgroundMode: continuable

              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                # Enpoi Harness: fork is disabled — the orchestration architecture uses
                # spawn-in-process exclusively (oracle = continuable spawn, workers =
                # one-shot spawn). Keeping fork out of the catalog keeps the tool
                # surface byte-stable and the model unconfused.
                disabled: true
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable

              # Production dsh does not install these optional providers. Install the
              # matching Bundle in this Profile and restart the Host, then copy this
              # preset and remove `disabled` from the matching tool row. Host availability
              # alone grants no tool.
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          # ── remaining model-facing rows ─────────────────────────────────────────────

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # The `web` service and its search provider stay in the host composition; only
          # the model-facing tool is per-session.
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              # Zero-install gating: fetch is keyless/local and stays on by
              # default; search stays off until the wizard applies.
              search: false
              fetch: true
              searchTimeoutMs: 60000

          # ── presentation ────────────────────────────────────────────────────────────

          # Tool presentation for this agent. 'both' sends every visible schema
          # plus `run_code` with a generated TypeScript SDK.
          - id: tool-presentation
            name: '@deepseek-ai/dsh-agent-tool-presentation'
            config:
              # Enpoi: 'both' — native schemas + programmatic tool calling (run_code).
              mode: both

          # ── deliverables ────────────────────────────────────────────────────────────
          # Upstream 0.1.6-alpha.2: `present` shows this turn's changed files as review
          # cards in the chat. The /goal command is on hold for an allocation decision.
          - id: present
            name: '@deepseek-ai/dsh-tool-present'

- id: preset-standard
  disabled: true
- id: preset-ptc
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-cordis
  disabled: true
- id: agent-preset-registry
  config:
    default: orchestrator


# The upstream api-key DeepSeek route (`deepseek-official`) duplicates the
# route the operator composes through `llm-pi-ai`; its Models-page row offers
# no Delete (settingsPath []) and shows 0 models unless the api-key entry's
# volatile `models` field is populated. The profile routes its providers
# through llm-pi-ai, so the base entry stays disabled.
- id: llm-deepseek
  disabled: true
